<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NSE Institutional Live Screener</title>
  <style>
    :root { --bg: #0b0f19; --card: #151c2e; --border: #232f4b; --text: #e2e8f0; --dim: #94a3b8; --green: #10b981; --red: #ef4444; --accent: #3b82f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .wrapper { max-width: 1600px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    @media (max-width: 1024px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .card-head { padding: 12px 16px; font-weight: 700; font-size: 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    .head-buy { background: rgba(16, 185, 129, 0.1); color: var(--green); }
    .head-sell { background: rgba(239, 68, 68, 0.1); color: var(--red); }
    .head-up { background: rgba(59, 130, 246, 0.1); color: #60a5fa; }
    .head-down { background: rgba(239, 68, 68, 0.1); color: #f87171; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th { background: #0f1523; padding: 10px 12px; color: var(--dim); text-transform: uppercase; font-size: 11px; }
    td { padding: 10px 12px; border-top: 1px solid var(--border); }
    .badge { padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
    .badge-buy { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid var(--green); }
    .badge-sell { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid var(--red); }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div>
        <h2>Automated Institutional Screener</h2>
        <p id="lastSync" style="font-size: 12px; color: var(--dim); margin-top: 4px;">Fetching latest cloud data...</p>
      </div>
      <button onclick="loadDailyFeed()" style="background:var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;">↺ Refresh Data</button>
    </header>

    <!-- MOMENTUM -->
    <div class="grid">
      <div class="card">
        <div class="card-head head-up"><span>🚀 TOP UPSIDE MOMENTUM</span><span id="upCount">0</span></div>
        <div style="overflow-x:auto; max-height:350px;"><table id="momUpTable"></table></div>
      </div>
      <div class="card">
        <div class="card-head head-down"><span>🔻 TOP DOWNSIDE MOMENTUM</span><span id="downCount">0</span></div>
        <div style="overflow-x:auto; max-height:350px;"><table id="momDownTable"></table></div>
      </div>
    </div>

    <!-- VALUE FLOWS -->
    <div class="grid">
      <div class="card">
        <div class="card-head head-buy"><span>▲ TOP 20 INSTITUTIONAL BUYING</span><span id="buyCount">0</span></div>
        <div style="overflow-x:auto; max-height:550px;"><table id="buyTable"></table></div>
      </div>
      <div class="card">
        <div class="card-head head-sell"><span>▼ TOP 20 INSTITUTIONAL SELLING</span><span id="sellCount">0</span></div>
        <div style="overflow-x:auto; max-height:550px;"><table id="sellTable"></table></div>
      </div>
    </div>
  </div>

  <script>
    async function loadDailyFeed() {
      try {
        // Fetches the JSON generated by the 6:30 PM GitHub Action
        const res = await fetch('today.json?t=' + Date.now());
        if (!res.ok) throw new Error("Could not find today.json. Run the GitHub Action once to generate it.");
        const data = await res.json();
        
        document.getElementById('lastSync').innerText = `Last Updated: ${new Date(data.updatedAt).toLocaleString('en-IN')}`;

        buildTable('buyTable', data.buys, true);
        buildTable('sellTable', data.sells, false);
        buildMomTable('momUpTable', data.momUp, true);
        buildMomTable('momDownTable', data.momDown, false);

        document.getElementById('buyCount').innerText = `${data.buys.length} Stocks`;
        document.getElementById('sellCount').innerText = `${data.sells.length} Stocks`;
        document.getElementById('upCount').innerText = `${data.momUp.length} Stocks`;
        document.getElementById('downCount').innerText = `${data.momDown.length} Stocks`;
      } catch (err) {
        document.getElementById('lastSync').innerText = err.message;
      }
    }

    function buildTable(id, list, isBuy) {
      const table = document.getElementById(id);
      table.innerHTML = `<tr><th>#</th><th>Stock</th><th>Inst. VWAP</th><th>Net Flow</th><th>Call</th></tr>`;
      list.forEach((s, idx) => {
        table.innerHTML += `
          <tr>
            <td style="color:var(--dim);">${idx + 1}</td>
            <td><strong>${s.sym}</strong></td>
            <td>₹${s.price.toFixed(2)}</td>
            <td style="color:${isBuy ? 'var(--green)' : 'var(--red)'}; font-weight:700;">${isBuy ? '+' : ''}${s.netFlow} Cr</td>
            <td><span class="badge ${isBuy ? 'badge-buy' : 'badge-sell'}">${s.signal}</span></td>
          </tr>`;
      });
    }

    function buildMomTable(id, list, isUp) {
      const table = document.getElementById(id);
      table.innerHTML = `<tr><th>#</th><th>Stock</th><th>VWAP</th><th>Score</th><th>Action</th></tr>`;
      list.forEach((s, idx) => {
        table.innerHTML += `
          <tr>
            <td style="color:var(--dim);">${idx + 1}</td>
            <td><strong>${s.sym}</strong></td>
            <td>₹${s.price.toFixed(2)}</td>
            <td style="color:${isUp ? 'var(--green)' : 'var(--red)'}; font-weight:700;">${s.momScore}</td>
            <td><span class="badge ${isUp ? 'badge-buy' : 'badge-sell'}">${isUp ? 'BREAKOUT' : 'BREAKDOWN'}</span></td>
          </tr>`;
      });
    }

    loadDailyFeed();
  </script>
</body>
</html>
