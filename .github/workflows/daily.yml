name: Daily Institutional Data Sync

on:
  schedule:
    # Runs at 16:15 UTC (09:45 PM IST) Monday through Friday
    - cron: '15 16 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and process bhavcopy
        run: node fetch_deals.js

      - name: Commit and push updated today.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data [skip ci]" && git push)
